<text x="1030" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#b77b28">A  Road-edge backing</text>
<text x="1030" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Close exposed vertical faces.</text>
<text x="1030" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Top follows the repaired slope.</text>
<text x="1030" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Retain lower-route clearance.</text>
<text x="1030" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#b77b28">B  Ground / planting</text>
<text x="1030" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Re-form the upper bank with</text>
<text x="1030" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">paving, grass and low shrubs.</text>
<text x="1030" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Keep the blue lower route open.</text>
<text x="1030" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#6689aa">C  Terrace / podium edge</text>
<text x="1030" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Flat terrace stays flat.</text>
<text x="1030" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Close its outer facade below;</text>
<text x="1030" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">use glazing only where evidenced.</text>
<text x="1030" y="611" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#b63838">D  Remove old remnant</text>
<text x="1030" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Legacy sloped paving remains</text>
<text x="1030" y="672" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">at z 6.2-7.42 m above this area.</text>
<text x="1030" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Remove/trim it before adding fill.</text>
<text x="1030" y="751" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#38683a">Green  Open lower garden</text>
<text x="1030" y="784" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">Retain the approved footprint,</text>
<text x="1030" y="812" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">stairs, terrace and exits.</text>
<text x="1030" y="840" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172a3a">No raised slab across this void.</text>
<text x="80" y="879" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#172a3a">Blue: protected lower walking route. Orange: proposed edge/bank treatment, not a solid-fill mask.</text>
<text x="80" y="917" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#172a3a">Evidence: P010-P012, user photos 44-45, municipal 2024 orthophoto; branch 97769b5 (shaders-mod).</text>
<text x="80" y="954" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#172a3a">Photo/branch levels differ from this approved layout: transfer the construction method, not their 1.25 scale.</text>
<text x="80" y="992" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#526575">This review changes no map geometry or installed package. See README.md for the source comparison and next steps.</text>
